<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>BlendTinux: a tiny 3D modeller in your browser</title>
<meta name="description" content="BlendTinux is a free, absurdly simple 3D modeller that runs entirely in your browser: sculpt, paint, deform and export to GLB, OBJ, STL or PLY. Nothing is ever uploaded." />
<meta name="theme-color" content="#141419" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3.5' fill='%23141419'/%3E%3Cpath d='M8 2.8 12.6 5.4v5.2L8 13.2 3.4 10.6V5.4Z' fill='none' stroke='%23f0924f' stroke-width='1.3' stroke-linejoin='round'/%3E%3Cpath d='M8 2.8v10.4M3.4 5.4 8 8l4.6-2.6' fill='none' stroke='%23f0924f' stroke-width='.9' opacity='.7'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">
  <canvas id="view" aria-label="3D viewport"></canvas>

  <header id="topbar">
    <a id="home" href="/" data-tip="Back to tinux.dev">
      <svg class="ic" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" aria-hidden="true"><path d="M8 2.8 12.6 5.4v5.2L8 13.2 3.4 10.6V5.4Z"/><path d="M8 2.8v10.4M3.4 5.4 8 8l4.6-2.6" stroke-width=".9" opacity=".7"/></svg>
      <span class="wordmark">BlendTinux</span>
    </a>
    <div class="top-group">
      <div class="menuwrap">
        <button id="add-btn" class="pbtn accentbtn" data-tip="Add a shape to the scene">+ Add</button>
        <div id="add-menu" class="menu" hidden></div>
      </div>
    </div>
    <div id="mode-switch" class="seg" role="radiogroup" aria-label="Mode"></div>
    <div class="top-group right">
      <button id="undo-btn" class="tbtn" data-tip="Undo (Ctrl+Z)" aria-label="Undo" disabled></button>
      <button id="redo-btn" class="tbtn" data-tip="Redo (Ctrl+Y)" aria-label="Redo" disabled></button>
      <span class="vsep"></span>
      <button id="render-btn" class="pbtn" data-tip="ray-traced render: real light bounces, refines the longer it runs">Render</button>
      <button id="import-btn" class="pbtn" data-tip="Open an .obj file from your computer">Import</button>
      <div class="menuwrap">
        <button id="export-btn" class="pbtn" data-tip="Save your model as a file">Export</button>
        <div id="export-menu" class="menu" hidden></div>
      </div>
      <input id="import-file" type="file" accept=".obj" hidden />
    </div>
  </header>

  <div id="gizmo-switch" class="seg vert" role="radiogroup" aria-label="Transform tool" hidden></div>

  <aside id="outliner" aria-label="Shapes in the scene" hidden>
    <div class="plabel">Shapes</div>
    <div id="outliner-list"></div>
  </aside>

  <aside id="panel" hidden></aside>

  <div id="boxsel" hidden></div>
  <div id="ctxmenu" class="menu" hidden></div>
  <svg id="knife" aria-hidden="true" hidden></svg>

  <div id="render-overlay" hidden>
    <canvas id="render-canvas"></canvas>
    <div id="render-bar">
      <span id="render-stats" class="mono">warming up...</span>
      <button id="render-save" class="pbtn accentbtn">Save PNG</button>
      <button id="render-close" class="pbtn" data-tip="Esc">Close</button>
    </div>
  </div>
  <div id="hint" class="pill" hidden></div>
  <div id="status" class="pill mono" hidden></div>
  <div id="toasts" aria-live="polite"></div>
</div>

<script src="js/vendor/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/history.js"></script>
<script src="js/mesh.js"></script>
<script src="js/viewport.js"></script>
<script src="js/gizmo.js"></script>
<script src="js/sculpt.js"></script>
<script src="js/vertex.js"></script>
<script src="js/deform.js"></script>
<script src="js/io.js"></script>
<script src="js/render.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
